<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Denied</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

        font-family: "Trebuchet MS", Arial, sans-serif;
        color: white;

        background:
            radial-gradient(circle at 15% 20%, #ff4f9a33, transparent 30%),
            radial-gradient(circle at 85% 80%, #8b5cf633, transparent 30%),
            #090611;
    }

    /* Floating background particles */
    .particle {
        position: fixed;
        color: #ff72b5;
        opacity: 0.2;
        pointer-events: none;
        animation: float 6s ease-in-out infinite;
    }

    .p1 {
        top: 10%;
        left: 8%;
        font-size: 70px;
    }

    .p2 {
        top: 20%;
        right: 10%;
        font-size: 45px;
        animation-delay: 1s;
    }

    .p3 {
        bottom: 12%;
        left: 13%;
        font-size: 55px;
        animation-delay: 2s;
    }

    .p4 {
        bottom: 15%;
        right: 12%;
        font-size: 70px;
        animation-delay: 3s;
    }

    @keyframes float {
        50% {
            transform: translateY(-25px) rotate(8deg);
        }
    }

    /* Main card */
    .card {
        width: min(90%, 620px);
        padding: 50px 30px;

        text-align: center;

        background: rgba(20, 12, 29, 0.78);
        backdrop-filter: blur(20px);

        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 32px;

        box-shadow:
            0 30px 90px rgba(0,0,0,0.6),
            0 0 50px rgba(255,70,150,0.08);

        position: relative;
        z-index: 5;

        animation: appear 0.8s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Lock */
    .lock {
        width: 90px;
        height: 90px;

        margin: auto;
        margin-bottom: 25px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 42px;

        border-radius: 50%;

        background: linear-gradient(
            135deg,
            #ff4f9a,
            #8b5cf6
        );

        box-shadow:
            0 0 40px rgba(255,79,154,0.35);

        animation: lockPulse 2s infinite;
    }

    @keyframes lockPulse {
        0%,100% {
            box-shadow: 0 0 30px rgba(255,79,154,0.25);
        }

        50% {
            box-shadow: 0 0 55px rgba(255,79,154,0.5);
        }
    }

    .tag {
        display: inline-block;

        padding: 7px 15px;

        border-radius: 50px;

        background: rgba(255,79,154,0.1);
        border: 1px solid rgba(255,79,154,0.3);

        color: #ff8cbe;

        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;

        margin-bottom: 18px;
    }

    h1 {
        font-size: clamp(40px, 9vw, 62px);

        line-height: 1;

        margin-bottom: 20px;

        background:
            linear-gradient(
                90deg,
                #ff65aa,
                #d19aff
            );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
    }

    .message {
        color: #cfc4d4;

        font-size: 17px;

        line-height: 1.7;

        max-width: 480px;

        margin: auto;
        margin-bottom: 28px;
    }

    /* Contact box */
    .contact {
        padding: 22px;

        border-radius: 22px;

        background: rgba(255,255,255,0.05);

        border: 1px solid rgba(255,255,255,0.1);
    }

    .contact-label {
        color: #8f8395;

        font-size: 12px;

        text-transform: uppercase;

        letter-spacing: 1.5px;

        margin-bottom: 8px;
    }

    .name {
        font-size: 25px;

        font-weight: bold;

        color: white;

        text-shadow:
            0 0 20px rgba(255,255,255,0.15);
    }

    /* Button */
    .btn {
        display: inline-block;

        margin-top: 25px;

        padding: 14px 28px;

        border-radius: 50px;

        color: white;

        text-decoration: none;

        font-weight: bold;

        background:
            linear-gradient(
                90deg,
                #ff4f9a,
                #8b5cf6
            );

        box-shadow:
            0 10px 30px rgba(139,92,246,0.25);

        transition: 0.25s;

        cursor: pointer;
    }

    .btn:hover {
        transform: translateY(-3px) scale(1.04);

        box-shadow:
            0 15px 40px rgba(255,79,154,0.35);
    }

    .footer {
        margin-top: 25px;

        color: #665c6d;

        font-size: 11px;

        letter-spacing: 1px;
    }

    /* Secret message */
    #secret {
        display: none;

        margin-top: 20px;

        color: #ff9bc8;

        font-size: 14px;

        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    /* Mobile */
    @media(max-width: 500px) {

        .card {
            padding: 40px 20px;
        }

        .message {
            font-size: 15px;
        }

        .name {
            font-size: 21px;
        }
    }
</style>
</head>

<body>

<!-- Background decoration -->

<div class="particle p1">♡</div>
<div class="particle p2">✦</div>
<div class="particle p3">♡</div>
<div class="particle p4">✦</div>


<!-- Main content -->

<div class="card">

    <div class="lock">
        🔒
    </div>

    <div class="tag">
        Restricted Area
    </div>

    <h1>
        Access Denied
    </h1>

    <p class="message">
        Sorry... you don't have access to this area. 👀
        <br>
        If you think you should be allowed in,
        you know who to contact.
    </p>


    <div class="contact">

        <div class="contact-label">
            For access, please contact
        </div>

        <div class="name">
            Ed Daoudi Bilal
        </div>

    </div>


    <button class="btn" id="accessBtn">
        Request Access ✦
    </button>


    <div id="secret">
        Access request received... 👀<br>
        <b>Waiting for Ed Daoudi Bilal's approval.</b>
    </div>


    <div class="footer">
        SYSTEM STATUS: LOCKED • CODE 403
    </div>

</div>


<script>

    const button = document.getElementById("accessBtn");
    const secret = document.getElementById("secret");

    button.addEventListener("click", () => {

        button.textContent = "Request Sent ✓";

        button.style.opacity = "0.8";

        secret.style.display = "block";

        createParticles();

    });


    /* Little floating particles when button is clicked */

    function createParticles() {

        const symbols = ["♡", "♥", "✦", "✧"];

        for (let i = 0; i < 20; i++) {

            const particle = document.createElement("div");

            particle.innerHTML =
                symbols[Math.floor(Math.random() * symbols.length)];

            particle.style.position = "fixed";

            particle.style.left =
                Math.random() * 100 + "vw";

            particle.style.bottom = "-20px";

            particle.style.fontSize =
                15 + Math.random() * 25 + "px";

            particle.style.color = "#ff72b5";

            particle.style.pointerEvents = "none";

            particle.style.zIndex = "100";

            particle.style.transition =
                "transform 3s linear, opacity 3s linear";

            document.body.appendChild(particle);


            setTimeout(() => {

                particle.style.transform =
                    `translateY(-${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`;

                particle.style.opacity = "0";

            }, 50);


            setTimeout(() => {

                particle.remove();

            }, 3200);

        }

    }

</script>

</body>
</html>
